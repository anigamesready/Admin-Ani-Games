      - name: Inspect reconstructed V12.1.50 login flow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ["ADMIN_PROJECT_DIR"])
          web = root / "android/app/src/main/assets/web"
          gradle = (root / "android/app/build.gradle").read_text(encoding="utf-8")
          manifest = (root / "android/app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          print("=== SOURCE IDENTITY ===")
          for line in gradle.splitlines():
              if any(k in line for k in ("applicationId", "versionCode", "versionName")):
                  print(line.strip())
          for line in manifest.splitlines():
              if "android:label=" in line:
                  print(line.strip())
          print("=== HTML FILE INVENTORY ===")
          for p in sorted(web.glob("*.html")):
              print(p.name, p.stat().st_size)
          for name in ("admin.html", "admin-control.html"):
              p = web / name
              if not p.exists():
                  continue
              html = p.read_text(encoding="utf-8")
              print(f"=== {name}: LOGIN ELEMENTS / WIRING ===")
              lines = html.splitlines()
              needles = re.compile(r"(masuk|login|btnLogin|loginBtn|signIn|addEventListener\(['\"]click|onclick=)", re.I)
              selected = []
              for i, line in enumerate(lines):
                  if needles.search(line):
                      selected.append((i + 1, line[:900]))
              for n, line in selected[:80]:
                  print(f"L{n}: {line}")
              print(f"LOGIN RELATED LINE COUNT: {len(selected)}")
              for sig in ("async function login()", "function login()", "async function boot()", "function loginMsg("):
                  m = re.search(r"(?ms)^" + re.escape(sig) + r".*?^\}", html)
                  if m:
                      print(f"=== FUNCTION {sig} ===")
                      print(m.group(0)[:12000])
              scripts = re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.I | re.S)
              if not scripts:
                  raise SystemExit(f"No inline script found in {name}")
              out = Path("/tmp") / (name.replace(".html", "") + "-audit.js")
              out.write_text("\n".join(scripts), encoding="utf-8")
              print(f"INLINE_SCRIPT_COUNT {name}: {len(scripts)}")
          print("=== API/AUTH TOKENS ===")
          all_html = "\n".join(p.read_text(encoding="utf-8") for p in web.glob("*.html"))
          for token in ("signInWithPassword", "fetch(", "supabase.auth", "login()", "setAdminAuthEnabled", "startDualDbAdmin", "DB1_URL", "127.0.0.1:8788"):
              print(token, all_html.count(token))
          PY
