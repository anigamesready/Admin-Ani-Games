name: Build Ani-Games Reseller APK

on:
  push:
    branches:
      - main
    paths:
      - 'Ani-Games-Reseller-Android-SOURCE-v11.30.0.zip'
      - '.github/workflows/build-reseller-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Audit source and compile reseller APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android source archive
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="Ani-Games-Reseller-Android-SOURCE-v11.30.0.zip"
          test -s "$SOURCE_ZIP" || { echo "::error::Source ZIP is missing"; exit 1; }
          unzip -t "$SOURCE_ZIP"
          mkdir -p source
          unzip -oq "$SOURCE_ZIP" -d source
          SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS" || { echo "::error::No settings.gradle(.kts) found in source ZIP"; find source -maxdepth 4 -type f | head -100; exit 1; }
          ANDROID_DIR="$(dirname "$SETTINGS")"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Resolved Android project root: $ANDROID_DIR"
          echo "Files near project root:"
          find "$ANDROID_DIR" -maxdepth 2 -type f | sort | head -100

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Configure isolated reseller identity and audit web assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          root = Path(os.environ["ANDROID_DIR"])
          gradle_candidates = [root / "app/build.gradle", root / "app/build.gradle.kts"]
          gradle = next((p for p in gradle_candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit("app/build.gradle or app/build.gradle.kts not found")
          text = gradle.read_text(errors="replace")

          def set_gradle_value(key, value):
              nonlocal_text = None
              pattern = re.compile(r'(' + re.escape(key) + r'\s*=?\s*["\'])[^"\']+(["\'])')
              updated, count = pattern.subn(lambda m: m.group(1) + value + m.group(2), text, count=1)
              return updated, count

          text, ns_count = re.subn(
              r'(\bnamespace\s*=?\s*["\'])[^"\']+(["\'])',
              lambda m: m.group(1) + "com.anigames.reseller" + m.group(2), text, count=1)
          text, app_count = re.subn(
              r'(\bapplicationId\s*=?\s*["\'])[^"\']+(["\'])',
              lambda m: m.group(1) + "com.anigames.reseller" + m.group(2), text, count=1)
          if not ns_count:
              raise SystemExit("Cannot isolate Android namespace: Gradle namespace setting not found")
          if not app_count:
              raise SystemExit("Cannot isolate app install ID: applicationId setting not found")
          text, _ = re.subn(r'\bversionCode\s+\d+', 'versionCode 130', text, count=1)
          text, _ = re.subn(r'(\bversionName\s*=?\s*["\'])[^"\']+(["\'])',
                            lambda m: m.group(1) + "1.0.0" + m.group(2), text, count=1)
          gradle.write_text(text)
          print("Configured namespace and applicationId as com.anigames.reseller")

          # Re-home Java/Kotlin package declarations so generated R references use the reseller namespace.
          src = root / "app/src/main"
          if src.exists():
              for path in list(src.rglob("*.java")) + list(src.rglob("*.kt")):
                  body = path.read_text(errors="replace")
                  updated = body.replace("com.anigames.billingadmin", "com.anigames.reseller")
                  if updated != body:
                      path.write_text(updated)

          manifests = list(root.glob("app/src/main/AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("AndroidManifest.xml not found")
          manifest_path = manifests[0]
          manifest = manifest_path.read_text(errors="replace")
          if re.search(r'android:label\s*=\s*"[^"]+"', manifest):
              manifest = re.sub(r'android:label\s*=\s*"[^"]+"',
                                'android:label="Ani-Games Reseller"', manifest, count=1)
          else:
              raise SystemExit("Manifest has no explicit android:label to isolate")
          manifest_path.write_text(manifest)
          for strings in root.glob("app/src/main/res/values*/strings.xml"):
              body = strings.read_text(errors="replace")
              body = re.sub(r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                            r'\1Ani-Games Reseller\2', body, count=1, flags=re.S)
              strings.write_text(body)

          web_dirs = [p for p in root.glob("app/src/main/assets/**")
                      if p.is_dir() and (p / "index.html").is_file()]
          web_dir = next((p for p in web_dirs if p.name == "web"),
                         web_dirs[0] if web_dirs else None)
          if web_dir is None:
              raise SystemExit("WebView assets/index.html not found")
          print("Resolved WebView assets:", web_dir)
          print("HTML assets before audit:", [str(p.relative_to(web_dir)) for p in web_dir.rglob("*.html")])
          dashboard = web_dir / "admin-control.html"
          if not dashboard.is_file():
              raise SystemExit("Reseller dashboard admin-control.html is missing from WebView assets")

          # Guarantee the reseller dashboard uses the packaged brand logo without replacing its logic.
          logo = web_dir / "icon/logo.png"
          if not logo.is_file():
              raise SystemExit("Expected reseller logo asset icon/logo.png is missing")
          dashboard_text = dashboard.read_text(errors="replace")
          if "icon/logo.png" not in dashboard_text:
              body = re.search(r"<body\b[^>]*>", dashboard_text, re.I)
              if body:
                  insertion = body.end()
              else:
                  head = re.search(r"</head\s*>", dashboard_text, re.I)
                  insertion = head.end() if head else 0
              brand = ('<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;'
                       'margin:0 0 12px;border-bottom:1px solid #263449;font-weight:700">'
                       '<img src="icon/logo.png" alt="Ani-Games Reseller" '
                       'style="width:44px;height:44px;object-fit:contain;border-radius:10px">'
                       '<span>Ani-Games Reseller</span></div>')
              dashboard_text = dashboard_text[:insertion] + brand + dashboard_text[insertion:]
              dashboard.write_text(dashboard_text)
              print("Added reseller logo header to dashboard.")

          # Add a manual refresh control and expiry sound notifier to the reseller UI.
          msg_anchor = '<div id="msg" class="msg hidden"></div>'
          if msg_anchor not in dashboard_text:
              raise SystemExit("Cannot add reseller refresh controls: message container not found")
          toolbar = """
          <div id="resellerRefreshSoundBar" class="section card" style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap">
            <button id="resellerRefreshButton" class="primary" onclick="manualResellerRefresh()">⟳ Refresh Status &amp; Sync</button>
            <label style="display:flex;align-items:center;gap:8px;font-size:12px"><input id="resellerSoundToggle" type="checkbox" checked onchange="toggleResellerSound()" style="width:18px;height:18px"> Suara notifikasi rental habis</label>
            <button onclick="testResellerSound()">▶ Tes Suara</button>
          </div>
          """
          if 'id="resellerRefreshSoundBar"' not in dashboard_text:
              dashboard_text = dashboard_text.replace(msg_anchor, msg_anchor + toolbar, 1)
          js_anchor = "async function refreshAll()"
          if js_anchor not in dashboard_text:
              raise SystemExit("Cannot add reseller refresh controls: refreshAll() was not found")
          if "function monitorResellerRentalExpiry" not in dashboard_text:
              reseller_script = r"""
          let resellerSoundEnabled = sessionStorage.getItem("ani_games_reseller_sound") !== "off";
          let resellerAudioContext = null;
          const resellerPreviousRentalStates = new Map();
          const resellerAlertedExpiryKeys = new Set();
          const resellerSoundControl = document.getElementById("resellerSoundToggle");
          if (resellerSoundControl) resellerSoundControl.checked = resellerSoundEnabled;
          function toggleResellerSound() {
            resellerSoundEnabled = !!document.getElementById("resellerSoundToggle")?.checked;
            sessionStorage.setItem("ani_games_reseller_sound", resellerSoundEnabled ? "on" : "off");
            if (resellerSoundEnabled) testResellerSound();
          }
          function beepResellerExpiry() {
            if (!resellerSoundEnabled) return;
            try {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (!AudioCtx) return;
              if (!resellerAudioContext) resellerAudioContext = new AudioCtx();
              if (resellerAudioContext.state === "suspended") resellerAudioContext.resume().catch(() => {});
              [0, 0.22, 0.44].forEach((delay, i) => {
                const start = resellerAudioContext.currentTime + delay;
                const osc = resellerAudioContext.createOscillator();
                const gain = resellerAudioContext.createGain();
                osc.type = "sine"; osc.frequency.value = [880, 660, 880][i];
                gain.gain.setValueAtTime(0.0001, start);
                gain.gain.exponentialRampToValueAtTime(0.18, start + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.17);
                osc.connect(gain); gain.connect(resellerAudioContext.destination);
                osc.start(start); osc.stop(start + 0.18);
              });
            } catch (_) {}
          }
          function testResellerSound() {
            beepResellerExpiry();
            if (typeof msg === "function") msg("Tes suara notifikasi rental.", false);
          }
          async function manualResellerRefresh() {
            const button = document.getElementById("resellerRefreshButton");
            if (button) { button.disabled = true; button.textContent = "⟳ Memperbarui status..."; }
            try { await refreshAll(); }
            finally { if (button) { button.disabled = false; button.innerHTML = "⟳ Refresh Status &amp; Sync"; } }
          }
          function monitorResellerRentalExpiry(rows) {
            for (const row of (rows || [])) {
              const code = String(row.code || row.id || "Rental");
              const key = String(row.id || (code + "|" + String(row.expiry_at || "")));
              const status = String(row.status || "").toLowerCase();
              const remaining = Number(row.remaining_seconds);
              const expired = ["expired", "ended", "finished"].includes(status) || (Number.isFinite(remaining) && remaining <= 0);
              const previous = resellerPreviousRentalStates.get(key);
              if (previous && !previous.expired && expired && !resellerAlertedExpiryKeys.has(key)) {
                resellerAlertedExpiryKeys.add(key);
                beepResellerExpiry();
                if (typeof msg === "function") msg("⏰ Sesi rental " + code + " terdeteksi habis.", true);
              }
              resellerPreviousRentalStates.set(key, { expired: expired, remaining: Number.isFinite(remaining) ? remaining : null, status: status });
            }
          }
          """
              dashboard_text = dashboard_text.replace(js_anchor, reseller_script + js_anchor, 1)
          load_anchor = "const rows=await rpc('billing_rental_accounts',{p_session_token:token,p_org_id:org.id,p_device_id:d.id});$('rentalRows').innerHTML="
          if load_anchor not in dashboard_text:
              raise SystemExit("Cannot add rental-expiry sound: billing_rental_accounts render point not found")
          if "monitorResellerRentalExpiry(rows)" not in dashboard_text:
              dashboard_text = dashboard_text.replace(load_anchor, load_anchor.replace(";$(", ";monitorResellerRentalExpiry(rows);$("), 1)
          dashboard.write_text(dashboard_text)
          print("Added manual refresh/sync and rental-expiry sound notifier.")

          # Remove unused legacy entry points only; retain the reseller login and dashboard.
          for name in ("admin.html", "billing.html", "v11-cloud.js"):
              target = web_dir / name
              if target.is_file():
                  target.unlink()
                  print("Removed unused legacy entry point:", target.name)
          icon_dir = web_dir / "icon"
          for name in ("admin.html", "admin-control.html", "billing.html", "index.html", "v11-cloud.js"):
              target = icon_dir / name
              if target.is_file():
                  target.unlink()
                  print("Removed duplicate legacy asset:", str(target.relative_to(web_dir)))

          html_files = list(web_dir.rglob("*.html"))
          forbidden = re.compile(r"billing_command\s*\(|billing_start_trial|admin_disconnect_device|restart_pc|shutdown_pc|\blogoff\b|start_trial|queue_command", re.I)
          hits = []
          for path in html_files:
              for n, line in enumerate(path.read_text(errors="replace").splitlines(), 1):
                  if forbidden.search(line):
                      hits.append(f"{path.relative_to(web_dir)}:{n}:{line.strip()[:180]}")
          if hits:
              print("\n".join(hits[:50]))
              raise SystemExit("Restricted Windows/pairing command strings found in reseller HTML; refusing to compile this UI")

          old_key = "sb_publishable_1Jsp3ZQDLwtozZ2hSPO83YA_7e1j723g"
          new_key = "sb_publishable_DobdCrOd43-vluON5gV7hg_6Js2Ea5V"
          # Migrate only the known obsolete public publishable key; no secret keys are embedded.
          for path in web_dir.rglob("*"):
              if path.is_file() and path.suffix.lower() in (".html", ".js", ".json", ".txt"):
                  body_text = path.read_text(errors="replace")
                  if old_key in body_text:
                      path.write_text(body_text.replace(old_key, new_key))
                      print("Updated obsolete public API key in", path.relative_to(web_dir))
          all_web_text = "\n".join(
              p.read_text(errors="replace") for p in web_dir.rglob("*")
              if p.is_file() and p.suffix.lower() in (".html", ".js", ".json", ".txt"))
          if old_key in all_web_text:
              raise SystemExit("Rejected legacy publishable key found in reseller assets")
          if new_key not in all_web_text:
              raise SystemExit("Expected current Supabase publishable key not found in reseller assets")
          if "icon/logo.png" not in (web_dir / "index.html").read_text(errors="replace"):
              raise SystemExit("Reseller login does not reference icon/logo.png")
          if "icon/logo.png" not in dashboard.read_text(errors="replace"):
              raise SystemExit("Reseller dashboard does not reference icon/logo.png")
          # Remove explanatory/disclaimer text at the bottom of the reseller login and dashboard,
          # while keeping the actual form, app behavior, and navigation untouched.
          login = web_dir / "index.html"
          login_text = login.read_text(errors="replace")
          login_text, login_removed = re.subn(
              r'\s*<div\s+class=["\']hint["\'][^>]*>.*?</div\s*>', '', login_text,
              count=1, flags=re.I | re.S)
          if login_removed:
              login.write_text(login_text)
              print("Removed bottom explanatory hint from reseller login.")
          dashboard_text = dashboard.read_text(errors="replace")
          dashboard_text, footer_removed = re.subn(
              r'\s*<div\s+class=["\']footer["\'][^>]*>.*?</div\s*>', '', dashboard_text,
              count=1, flags=re.I | re.S)
          if footer_removed:
              dashboard.write_text(dashboard_text)
              print("Removed bottom draft/disclaimer footer from reseller dashboard.")
          # Apply the requested black / purple neon reseller visual refresh as CSS only.
          # This intentionally leaves all Supabase calls, rental logic, navigation and event handlers unchanged.
          theme_css = r"""
          <style id="anigames-reseller-neon-theme">
          :root{--bg:#07060d;--panel:#100d1b;--panel2:#171127;--line:#35234f;--text:#f7f2ff;--muted:#b7a9cc;--blue:#a855f7;--cyan:#d946ef;--red:#fb5478;--green:#39e6a5;--yellow:#f7c95c}
          html{background:#07060d}
          body{background:radial-gradient(ellipse at 12% -8%,#32104d 0,transparent 38%),radial-gradient(ellipse at 100% 12%,#1c1040 0,transparent 35%),#07060d!important;color:var(--text)!important}
          .card,.pc-main,.stat,.modal-box{background:linear-gradient(155deg,rgba(25,17,40,.98),rgba(12,9,20,.98))!important;border-color:#392653!important;box-shadow:0 12px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(216,180,254,.04)}
          .brand span,.brandlockup .brand span,h1 span{color:#d946ef!important}
          .brand,.brandlockup .brand{letter-spacing:.2px}
          .topbar{border-color:#35234f!important}
          .btn.primary,.primary,.btn:not(.secondary):not(.light){background:linear-gradient(135deg,#9333ea,#c026d3)!important;border:1px solid #c084fc!important;color:#fff!important;box-shadow:0 5px 18px rgba(168,85,247,.22)}
          .btn.primary:active,.primary:active,.btn:not(.secondary):not(.light):active{transform:translateY(1px)}
          .btn.secondary,.secondary{background:#1b1428!important;border:1px solid #48305f!important;color:#e9d5ff!important}
          .btn.light{background:#24172f!important;color:#f5d0fe!important;border:1px solid #53356c!important}
          input,select,textarea{background:#0b0912!important;border-color:#403052!important;color:#f7f2ff!important}
          input:focus,select:focus,textarea:focus{outline:2px solid rgba(192,132,252,.35)!important;border-color:#c084fc!important}
          .pill{border-color:#49345f!important;background:#20152e!important;color:#e9d5ff!important}
          .pill.online,.status.active{background:rgba(16,185,129,.12)!important;border-color:#187f62!important;color:#5ee8b5!important}
          .pill.offline,.status.expired{background:rgba(244,63,94,.12)!important;border-color:#87334a!important;color:#ff8aa0!important}
          .stat-value,.stat-value.blue{color:#d8b4fe!important}
          .stat-value.green{color:#5ee8b5!important}.stat-value.red{color:#ff8aa0!important}
          .nav{gap:8px!important}
          .nav .btn.active{background:linear-gradient(135deg,#7e22ce,#a21caf)!important;border-color:#c084fc!important;color:#fff!important}
          .section-title{color:#f3e8ff!important}
          .muted,.help,.pc-detail-line,.stat-label{color:#b7a9cc!important}
          .inner-box,.pc-item,.soundbox{background:#100c19!important;border-color:#35234f!important}
          table{border-color:#35234f!important}th{background:#1a1226!important;color:#d8b4fe!important}td{border-color:#2d203d!important}
          tr:hover td{background:rgba(168,85,247,.055)!important}
          .logo,.brand-logo{filter:drop-shadow(0 0 12px rgba(217,70,239,.2))}
          .modal{backdrop-filter:blur(8px)}
          @media(max-width:600px){.wrap{padding:12px!important}.card{border-radius:18px!important}.topbar{gap:10px!important}.nav{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))}.nav .btn{width:100%;min-height:42px}.stats{gap:8px!important}.stat{border-radius:15px!important}.pcbar{gap:10px!important}.refresh{width:100%}}
          </style>
          """
          for page in (login, dashboard):
              page_text = page.read_text(errors="replace")
              page_text = re.sub(r'<style id="anigames-reseller-neon-theme">.*?</style>', '', page_text,
                                 count=1, flags=re.I | re.S)
              head_end = re.search(r'</head\\s*>', page_text, re.I)
              if not head_end:
                  raise SystemExit(f"Cannot apply reseller UI theme: </head> missing in {page.name}")
              page_text = page_text[:head_end.start()] + theme_css + page_text[head_end.start():]
              page.write_text(page_text)
          print("Applied black/purple neon reseller UI theme (CSS only; app logic preserved).")

          print("Reseller identity, package, UI entry-point, restricted-action, logo and API-key audits passed.")
          PY

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Verify APK identity and prepare output
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::No debug APK was produced"; exit 1; }
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          test -n "$AAPT" || { echo "::error::aapt not found"; exit 1; }
          mkdir -p output
          "$AAPT" dump badging "$APK" > output/apk-badging.txt
          cat output/apk-badging.txt | head -8
          grep -q "package: name='[^']*reseller[^']*'" output/apk-badging.txt || { echo "::error::Built package ID is not reseller-specific"; exit 1; }
          cp "$APK" output/Ani-Games-Reseller-v11.30.0-debug.apk
          sha256sum output/Ani-Games-Reseller-v11.30.0-debug.apk | tee output/SHA256SUMS.txt
          ls -lh output/Ani-Games-Reseller-v11.30.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ani-Games-Reseller-v11.30.0-debug-apk
          path: |
            output/Ani-Games-Reseller-v11.30.0-debug.apk
            output/SHA256SUMS.txt
            output/apk-badging.txt
          if-no-files-found: error
          retention-days: 30
