name: Audit admin APK requested features

on:
  push:
    branches:
      - audit/feature-check-20261018

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact feature implementations in embedded source
        shell: bash
        run: |
          python3 - <<'PY'
          import re, zipfile
          from pathlib import Path

          archive = Path("AniGames-Admin-V12.1.4-ANDROID-PASSWORD-RESET-PATCH-v3.zip")
          with zipfile.ZipFile(archive) as z:
              files = {i.filename: z.read(i).decode("utf-8", "ignore")
                       for i in z.infolist() if not i.is_dir()
                       and Path(i.filename).suffix.lower() in {".java",".kt",".js",".html",".htm",".xml",".json",".gradle",".properties",".txt",".md",".kts"}}
          print("SOURCE ARCHIVE:", archive.name)
          print("TEXT FILES SCANNED:", len(files))
          terms = {
            "DB1_URL": r"wzkjpycjizexxcxrfdvr",
            "DB2_URL": r"xcdbipgsvohesxhxydep",
            "usage_exceeded": r"usage_exceeded",
            "fallback": r"fallback",
            "pairing": r"pairing|pair.?code|pairing.?code|device.?pair",
            "Android notification APIs": r"NotificationChannel|NotificationManager|NotificationCompat|POST_NOTIFICATIONS|FirebaseMessagingService|Notification\.requestPermission|new Notification\s*\(",
            "browser Notification APIs": r"Notification\.requestPermission|new Notification\s*\(|serviceWorker\.ready|showNotification\s*\(",
            "sound APIs": r"AudioContext|webkitAudioContext|createOscillator|MediaPlayer|AudioManager|ToneGenerator|SoundPool|Ringtone|Vibrator|vibrate\s*\(|playSound|beep",
            "rental-ended alert logic": r"monitor.*(expiry|rental|session)|expired|expiry|finishSessionFromTimer|Sesi .*dihentikan|rental.*ended"
          }
          for title, pattern in terms.items():
              rx = re.compile(pattern, re.I)
              matches = []
              for name, text in files.items():
                  count = len(rx.findall(text))
                  if count:
                      matches.append((name, count, text))
              print(f"\n[{title}] files_with_matches={len(matches)} total_matches={sum(m[1] for m in matches)}")
              for name, count, text in matches[:10]:
                  print(f"  {name}: {count} match(es)")
                  if title in {"usage_exceeded", "fallback", "pairing", "Android notification APIs", "browser Notification APIs", "sound APIs"}:
                      for m in list(rx.finditer(text))[:2]:
                          a=max(0,m.start()-130); b=min(len(text),m.end()+180)
                          print("    CONTEXT:", re.sub(r"\s+", " ", text[a:b])[:400])
          for name in files:
              if name.endswith("AndroidManifest.xml") or name.endswith("MainActivity.java") or name.endswith("AUDIT-PASSWORD-RESET-PATCH-V3.md") or name.endswith("AUDIT-V12.1.4-TEST-PATCH.md") or name.endswith("PASSWORD-RESET-ANDROID-PATCH.md"):
                  print("\n===== FILE:", name, "=====")
                  print(files[name][:5000])
          PY
