name: Audit admin APK requested features

on:
  push:
    branches:
      - audit/feature-check-20261018

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact feature implementations in embedded source
        shell: bash
        run: |
          python3 - <<'PY'
          import re, zipfile
          from pathlib import Path

          archive = Path("AniGames-Admin-V12.1.4-ANDROID-PASSWORD-RESET-PATCH-v3.zip")
          with zipfile.ZipFile(archive) as z:
              files = {i.filename: z.read(i).decode("utf-8", "ignore")
                       for i in z.infolist() if not i.is_dir()
                       and Path(i.filename).suffix.lower() in {".java",".kt",".js",".html",".htm",".xml",".json",".gradle",".properties",".txt",".md",".kts"}}
          print("SOURCE ARCHIVE:", archive.name, "| text files:", len(files))
          terms = {
            "DB1_URL": r"wzkjpycjizexxcxrfdvr",
            "DB2_URL": r"xcdbipgsvohesxhxydep",
            "usage_exceeded": r"usage_exceeded",
            "fallback": r"fallback",
            "pairing / enrollment": r"pairing|pair.?code|enrollment|device.?enroll",
            "native notifications": r"NotificationChannel|NotificationManager|NotificationCompat|POST_NOTIFICATIONS|FirebaseMessagingService",
            "browser notifications": r"Notification\.requestPermission|new Notification\s*\(|showNotification\s*\(",
            "sound APIs": r"AudioContext|webkitAudioContext|createOscillator|MediaPlayer|AudioManager|ToneGenerator|SoundPool|Ringtone|Vibrator|vibrate\s*\(|playSound|beep",
          }
          for title, pattern in terms.items():
              rx = re.compile(pattern, re.I)
              found = []
              for name, txt in files.items():
                  matches = list(rx.finditer(txt))
                  if matches:
                      found.append((name, txt, matches))
              print(f"\n[{title}] files={len(found)} matches={sum(len(m[2]) for m in found)}")
              for name, txt, matches in found[:8]:
                  print(" FILE:", name, "| hits:", len(matches))
                  if title in {"DB1_URL", "DB2_URL", "usage_exceeded", "fallback"}:
                      for m in matches[:3]:
                          print("  CONTEXT:", re.sub(r"\s+", " ", txt[max(0,m.start()-180):min(len(txt),m.end()+240)])[:500])
          print("\n[PAIRING CODE: DB selection / fallback references]")
          for name, txt in files.items():
              if not any(k in name.lower() for k in ("admin.html","index.html","v11-cloud.js","mainactivity.java")): continue
              if not re.search(r"pair|enroll|usage_exceeded|DB1|DB2|fallback", txt, re.I): continue
              print(" FILE:", name)
              patterns = [r"DB1",r"DB2",r"usage_exceeded",r"fallback",r"device.?enroll",r"pairing.?fallback"]
              for p in patterns:
                  hits=list(re.finditer(p,txt,re.I))
                  if hits:
                      for m in hits[:2]:
                          print("  ",p,":",re.sub(r"\s+"," ",txt[max(0,m.start()-150):min(len(txt),m.end()+180)])[:400])
          for name, txt in files.items():
              if name.endswith("AndroidManifest.xml") or name.endswith("MainActivity.java") or name.endswith("AUDIT-PASSWORD-RESET-PATCH-V3.md") or name.endswith("AUDIT-V12.1.4-TEST-PATCH.md") or name.endswith("PASSWORD-RESET-ANDROID-PATCH.md"):
                  print("\n===== FILE:", name, "=====")
                  print(txt[:3500])
          PY
