name: Build Ani-Games Reseller V1.0.6 DB Android APK

on:
  push:
    branches:
      - reseller-v1.0.6-DB-Android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build isolated Reseller DB Android V1.0.6 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android source archive
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="Ani-Games-Reseller-Android-SOURCE-v11.30.0.zip"
          test -s "$SOURCE_ZIP" || { echo "::error::Source ZIP is missing"; exit 1; }
          unzip -t "$SOURCE_ZIP"
          mkdir -p source
          unzip -oq "$SOURCE_ZIP" -d source
          SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS" || { echo "::error::No settings.gradle(.kts) found in source ZIP"; find source -maxdepth 4 -type f | head -100; exit 1; }
          ANDROID_DIR="$(dirname "$SETTINGS")"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Resolved Android project root: $ANDROID_DIR"
          echo "Files near project root:"
          find "$ANDROID_DIR" -maxdepth 2 -type f | sort | head -100

      - name: Validate and extract exact HTML Review template
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, tarfile
          from pathlib import Path

          part_dir = Path("reseller/ui-review-parts")
          expected_parts = ["01.b64", "02.b64", "03a.b64", "03b.b64", "03c.b64",
                            "03d.b64", "03e.b64", "04.b64"]
          if any(not (part_dir / name).is_file() for name in expected_parts):
              raise SystemExit("One or more verified HTML Review archive parts are missing")
          encoded = "".join((part_dir / name).read_text().strip() for name in expected_parts)
          if len(encoded) != 17764:
              raise SystemExit(f"HTML Review archive encoded length mismatch: {len(encoded)}")
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          if digest != "c90fc770c78687748caafb21b83a421bb61d65eb4ea2ef00f9280d76562993ed":
              raise SystemExit(f"HTML Review archive SHA-256 mismatch: {digest}")
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as tf:
              members = {Path(m.name).name: m for m in tf.getmembers() if m.isfile()}
              expected_hashes = {
                  "index.html": ("8df0434644b1d2d1ce46371453ebd3c15d8b53f82a54b623232d8a2674090f56", 5258),
                  "admin-control.html": ("3504dbc2b91143627c191f18ddeabb246907467bb7348d690f42246ecbfd720e", 39028),
              }
              out = Path("review-ui")
              out.mkdir(exist_ok=True)
              for name, (expected_hash, expected_size) in expected_hashes.items():
                  if name not in members:
                      raise SystemExit(f"Supplied HTML Review archive lacks {name}")
                  stream = tf.extractfile(members[name])
                  if stream is None:
                      raise SystemExit(f"Cannot read {name} from HTML Review archive")
                  raw = stream.read()
                  actual_hash = hashlib.sha256(raw).hexdigest()
                  if len(raw) != expected_size or actual_hash != expected_hash:
                      raise SystemExit(f"Supplied {name} failed integrity check")
                  (out / name).write_bytes(raw)
          print("Verified exact index.html and admin-control.html from the supplied HTML Review ZIP.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Configure isolated reseller identity and audit web assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          root = Path(os.environ["ANDROID_DIR"])
          gradle_candidates = [root / "app/build.gradle", root / "app/build.gradle.kts"]
          gradle = next((p for p in gradle_candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit("app/build.gradle or app/build.gradle.kts not found")
          text = gradle.read_text(errors="replace")

          def set_gradle_value(key, value):
              nonlocal_text = None
              pattern = re.compile(r'(' + re.escape(key) + r'\s*=?\s*["\'])[^"\']+(["\'])')
              updated, count = pattern.subn(lambda m: m.group(1) + value + m.group(2), text, count=1)
              return updated, count

          text, ns_count = re.subn(
              r'(\bnamespace\s*=?\s*["\'])[^"\']+(["\'])',
              lambda m: m.group(1) + "com.anigames.reseller" + m.group(2), text, count=1)
          text, app_count = re.subn(
              r'(\bapplicationId\s*=?\s*["\'])[^"\']+(["\'])',
              lambda m: m.group(1) + "com.anigames.reseller" + m.group(2), text, count=1)
          if not ns_count:
              raise SystemExit("Cannot isolate Android namespace: Gradle namespace setting not found")
          if not app_count:
              raise SystemExit("Cannot isolate app install ID: applicationId setting not found")
          text, _ = re.subn(r'\bversionCode\s+\d+', 'versionCode 131', text, count=1)
          text, _ = re.subn(r'(\bversionName\s*=?\s*["\'])[^"\']+(["\'])',
                            lambda m: m.group(1) + "1.0.1" + m.group(2), text, count=1)
          gradle.write_text(text)
          print("Configured namespace and applicationId as com.anigames.reseller")

          # Re-home Java/Kotlin package declarations so generated R references use the reseller namespace.
          src = root / "app/src/main"
          if src.exists():
              for path in list(src.rglob("*.java")) + list(src.rglob("*.kt")):
                  body = path.read_text(errors="replace")
                  updated = body.replace("com.anigames.billingadmin", "com.anigames.reseller")
                  if updated != body:
                      path.write_text(updated)

          manifests = list(root.glob("app/src/main/AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("AndroidManifest.xml not found")
          manifest_path = manifests[0]
          manifest = manifest_path.read_text(errors="replace")
          if re.search(r'android:label\s*=\s*"[^"]+"', manifest):
              manifest = re.sub(r'android:label\s*=\s*"[^"]+"',
                                'android:label="Ani-Games Reseller"', manifest, count=1)
          else:
              raise SystemExit("Manifest has no explicit android:label to isolate")
          manifest_path.write_text(manifest)
          for strings in root.glob("app/src/main/res/values*/strings.xml"):
              body = strings.read_text(errors="replace")
              body = re.sub(r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                            r'\1Ani-Games Reseller\2', body, count=1, flags=re.S)
              strings.write_text(body)

          web_dirs = [p for p in root.glob("app/src/main/assets/**")
                      if p.is_dir() and (p / "index.html").is_file()]
          web_dir = next((p for p in web_dirs if p.name == "web"),
                         web_dirs[0] if web_dirs else None)
          if web_dir is None:
              raise SystemExit("WebView assets/index.html not found")
          print("Resolved WebView assets:", web_dir)
          print("HTML assets before audit:", [str(p.relative_to(web_dir)) for p in web_dir.rglob("*.html")])
          # Overlay the exact UI files supplied in Ani-Games-Reseller-HTML-Review-v1.0.0.zip.
          for name in ("index.html", "admin-control.html"):
              source_ui = Path("review-ui") / name
              if not source_ui.is_file():
                  raise SystemExit("Verified HTML Review UI file is missing: " + name)
              (web_dir / name).write_bytes(source_ui.read_bytes())
          print("Applied the exact supplied HTML Review login and dashboard.")
          dashboard = web_dir / "admin-control.html"
          if not dashboard.is_file():
              raise SystemExit("Reseller dashboard admin-control.html is missing from WebView assets")

          # Keep the review template's own dashboard markup and controls unchanged.
          # The logo remains on its designed login screen; do not inject a new header or toolbar.
          logo = web_dir / "icon/logo.png"
          if not logo.is_file():
              raise SystemExit("Expected reseller logo asset icon/logo.png is missing")

          # Remove unused legacy entry points only; retain the reseller login and dashboard.
          for name in ("admin.html", "billing.html", "v11-cloud.js"):
              target = web_dir / name
              if target.is_file():
                  target.unlink()
                  print("Removed unused legacy entry point:", target.name)
          icon_dir = web_dir / "icon"
          for name in ("admin.html", "admin-control.html", "billing.html", "index.html", "v11-cloud.js"):
              target = icon_dir / name
              if target.is_file():
                  target.unlink()
                  print("Removed duplicate legacy asset:", str(target.relative_to(web_dir)))

          html_files = list(web_dir.rglob("*.html"))
          forbidden = re.compile(r"billing_command\s*\(|billing_start_trial|admin_disconnect_device|restart_pc|shutdown_pc|\blogoff\b|start_trial|queue_command", re.I)
          hits = []
          for path in html_files:
              for n, line in enumerate(path.read_text(errors="replace").splitlines(), 1):
                  if forbidden.search(line):
                      hits.append(f"{path.relative_to(web_dir)}:{n}:{line.strip()[:180]}")
          if hits:
              print("\n".join(hits[:50]))
              raise SystemExit("Restricted Windows/pairing command strings found in reseller HTML; refusing to compile this UI")

          old_key = "sb_publishable_1Jsp3ZQDLwtozZ2hSPO83YA_7e1j723g"
          new_key = "sb_publishable_DobdCrOd43-vluON5gV7hg_6Js2Ea5V"
          # Migrate only the known obsolete public publishable key; no secret keys are embedded.
          for path in web_dir.rglob("*"):
              if path.is_file() and path.suffix.lower() in (".html", ".js", ".json", ".txt"):
                  body_text = path.read_text(errors="replace")
                  if old_key in body_text:
                      path.write_text(body_text.replace(old_key, new_key))
                      print("Updated obsolete public API key in", path.relative_to(web_dir))
          all_web_text = "\n".join(
              p.read_text(errors="replace") for p in web_dir.rglob("*")
              if p.is_file() and p.suffix.lower() in (".html", ".js", ".json", ".txt"))
          if old_key in all_web_text:
              raise SystemExit("Rejected legacy publishable key found in reseller assets")
          if new_key not in all_web_text:
              raise SystemExit("Expected current Supabase publishable key not found in reseller assets")
          if "icon/logo.png" not in (web_dir / "index.html").read_text(errors="replace"):
              raise SystemExit("Reseller login does not reference icon/logo.png")
          # Remove explanatory/disclaimer text at the bottom of the reseller login and dashboard,
          # while keeping the actual form, app behavior, and navigation untouched.
          login = web_dir / "index.html"
          login_text = login.read_text(errors="replace")
          login_text, login_removed = re.subn(
              r'\s*<div\s+class=["\']hint["\'][^>]*>.*?</div\s*>', '', login_text,
              count=1, flags=re.I | re.S)
          if login_removed:
              login.write_text(login_text)
              print("Removed bottom explanatory hint from reseller login.")
          dashboard_text = dashboard.read_text(errors="replace")
          dashboard_text, footer_removed = re.subn(
              r'\s*<div\s+class=["\']footer["\'][^>]*>.*?</div\s*>', '', dashboard_text,
              count=1, flags=re.I | re.S)
          if footer_removed:
              dashboard.write_text(dashboard_text)
              print("Removed bottom draft/disclaimer footer from reseller dashboard.")
          # Keep the exact dark navy/blue/cyan UI from the supplied HTML Review template.
          # Do not override its colors with a separate theme; only layout/functions are retained.

          print("Reseller identity, package, UI entry-point, restricted-action, logo and API-key audits passed.")
          PY

      - name: Apply V11.30.2 final global DB route runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_reseller_global_db_route.py "$ANDROID_DIR"
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path(__import__('os').environ['ANDROID_DIR'])
          files = [p for p in root.rglob('index.html') if p.parent.name == 'web' and (p.parent/'admin-control.html').exists()]
          if len(files) != 1:
              raise SystemExit(f'Expected one patched reseller UI pair, found {len(files)}')
          for path in [files[0], files[0].parent/'admin-control.html']:
              text = path.read_text(encoding='utf-8')
              for marker in ('resolveResellerGlobalRoute','DB_ROUTE_NOT_FINALIZED','DB_ROUTE_STAMP_KEY',
                             'DB_ROUTE_SPLIT_BRAIN','DB_SYNC_IN_PROGRESS','DB2_ROUTE_URL','DB2_ROUTE_KEY',
                             'DB2_ROUTE_REF','DB_ROUTE_CHANGED_LOGIN_REQUIRED'):
                  if marker not in text:
                      raise SystemExit(f'Route guard marker {marker} missing in {path.name}')
              scripts = re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, re.I|re.S)
              if len(scripts) != 1:
                  raise SystemExit(f'Expected one inline script in {path.name}, got {len(scripts)}')
              out = Path('/tmp') / (path.stem + '-reseller-route.js')
              out.write_text(scripts[0], encoding='utf-8')
          print('PASS: reseller resolves both DB route controls and forces a re-login after route/epoch change.')
          PY
          node --check /tmp/index-reseller-route.js
          node --check /tmp/admin-control-reseller-route.js
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ["ANDROID_DIR"])
          pages=[p for p in root.rglob("index.html") if p.parent.name=="web" and (p.parent/"admin-control.html").is_file()]
          if len(pages)!=1: raise SystemExit("Expected exactly one reseller login/dashboard pair")
          for p in (pages[0],pages[0].parent/"admin-control.html"):
              text=p.read_text(encoding="utf-8")
              if "AbortSignal.timeout" in text: raise SystemExit("Unsupported AbortSignal.timeout remains in "+p.name)
              if "fetchWithTimeout" not in text: raise SystemExit("WebView-compatible timeout helper missing in "+p.name)
          print("PASS: no AbortSignal.timeout; route status uses WebView-compatible timeout helper.")
          PY

      - name: Apply shared global rental CRUD
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_reseller_global_rental.py "$ANDROID_DIR"
          node --check /tmp/reseller-global-rental-dashboard.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path(__import__('os').environ['ANDROID_DIR'])
          paths = [p for p in root.rglob('admin-control.html') if p.parent.name == 'web']
          if len(paths) != 1:
              raise SystemExit(f'Expected one Reseller dashboard, found {len(paths)}')
          html = paths[0].read_text(encoding='utf-8')
          for marker in ('billing_reseller_rental_accounts_global',
                         'billing_reseller_create_rental_global',
                         'billing_reseller_edit_rental_global'):
              if marker not in html:
                  raise SystemExit(f'Missing global rental RPC marker: {marker}')
          for old in ("billing_create_rental',{", "billing_edit_rental',{", "waitCommand(result?.command_id)"):
              if old in html:
                  raise SystemExit('Legacy PC-dependent rental CRUD still present: ' + old)
          gradle = (root / 'app/build.gradle').read_text(encoding='utf-8')
          if not re.search(r'\bversionCode\s+134\b', gradle) or not re.search(r'\bversionName\s*=?\s*["\']1\.0\.4["\']', gradle):
              print(gradle)
              raise SystemExit('Expected Reseller version 1.0.4 / versionCode 134')
          print('PASS: global rental CRUD markers, no PC-wait path, and release version 1.0.4.')
          PY

      - name: Apply Reseller V1.0.5 global rental hard delete
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_reseller_global_rental_delete.py "$ANDROID_DIR"
          node --check /tmp/reseller-delete-dashboard.js
          python3 - <<'PY'
          import re, os
          from pathlib import Path
          root=Path(os.environ["ANDROID_DIR"])
          pages=[p for p in root.rglob("admin-control.html") if p.parent.name=="web"]
          if len(pages)!=1: raise SystemExit("Expected exactly one Reseller dashboard after V1.0.5 patch")
          page=pages[0].read_text(encoding="utf-8")
          for token in ("billing_reseller_delete_rental_global","deleteRental('${esc(r.id)}')","RENTAL_ACTIVE_TIMER_LOCKED","Hapus"):
              if token not in page: raise SystemExit("Missing Reseller hard-delete safeguard: "+token)
          for token in ('<option value="disabled">Nonaktif</option>',"billing_reseller_disable_rental_global"):
              if token in page: raise SystemExit("Old disabled-rental menu/action remains: "+token)
          for token in ("billing_reseller_create_rental_global","billing_reseller_edit_rental_global"):
              if token not in page: raise SystemExit("Existing Reseller CRUD regression: "+token)
          gradle=(root/"app/build.gradle").read_text(encoding="utf-8")
          if not re.search(r"\bversionCode\s+135\b",gradle) or not re.search(r"\bversionName\s*=?\s*['\"]1\.0\.5['\"]",gradle):
              raise SystemExit("Expected Reseller versionCode 135 / versionName 1.0.5")
          print("PASS: Reseller hard delete, active/paused safeguards, add/edit preserved and version 1.0.5.")
          PY

      - name: Apply Reseller V1.0.6 remembered login and editable rental status
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_reseller_login_status.py "$ANDROID_DIR"
          node --check /tmp/reseller-login-v106.js
          node --check /tmp/reseller-status-v106.js
          python3 - <<'PY'
          import re, os
          from pathlib import Path
          root=Path(os.environ["ANDROID_DIR"])
          login_pages=[p for p in root.rglob("index.html") if p.parent.name=="web" and (p.parent/"admin-control.html").is_file()]
          if len(login_pages)!=1: raise SystemExit("Expected exactly one reseller login/dashboard pair")
          login=login_pages[0].read_text(encoding="utf-8")
          page=(login_pages[0].parent/"admin-control.html").read_text(encoding="utf-8")
          for token in ("ani_games_reseller_saved_login_v1","loadSavedResellerLogin","saveResellerLogin(username,password)","rememberLogin"):
              if token not in login: raise SystemExit("Remember-login feature missing: "+token)
          for token in ('id="editStatus"','value="active">ACTIVE','value="disabled">DISABLE','value="expired">EXPIRED',"p_status:status"):
              if token not in page: raise SystemExit("Rental status editor missing: "+token)
          if "DB_ROUTE_SPLIT_BRAIN" not in login or "DB_ROUTE_SPLIT_BRAIN" not in page:
              raise SystemExit("Global DB route guard regression detected")
          gradle=(root/"app/build.gradle").read_text(encoding="utf-8")
          if not re.search(r"\bversionCode\s+136\b",gradle) or not re.search(r"""versionName\s*=?\s*['"]1\.0\.6['"]""",gradle):
              raise SystemExit("Expected Reseller V1.0.6 / versionCode 136")
          print("PASS: remembered credentials, editable ACTIVE/DISABLE/EXPIRED status, DB route guards and version 1.0.6.")
          PY

      - name: Apply isolated DB Android API and Keystore refresh-token adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_reseller_db_android_local_api.py source
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          root = Path(os.environ["ANDROID_DIR"])
          gradle = root / "app/build.gradle"
          manifest = root / "app/src/main/AndroidManifest.xml"
          g = gradle.read_text(encoding="utf-8")
          m = manifest.read_text(encoding="utf-8")
          if "applicationId 'com.anigames.reseller'" not in g:
              raise SystemExit("Reseller base applicationId anchor missing")
          if 'android:label="Ani-Games Reseller"' not in m:
              raise SystemExit("Reseller base label anchor missing")
          gradle.write_text(g.replace("applicationId 'com.anigames.reseller'", "applicationId 'com.anigames.reseller.dbandroid'", 1), encoding="utf-8")
          manifest.write_text(m.replace('android:label="Ani-Games Reseller"', 'android:label="Ani-Games Reseller DB Android"', 1), encoding="utf-8")
          for strings in root.glob("app/src/main/res/values*/strings.xml"):
              body = strings.read_text(encoding="utf-8")
              body = re.sub(r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                            r'\1Ani-Games Reseller DB Android\2', body, count=1, flags=re.S)
              strings.write_text(body, encoding="utf-8")
          web = root / "app/src/main/assets/web"
          login = (web / "index.html").read_text(encoding="utf-8")
          dashboard = (web / "admin-control.html").read_text(encoding="utf-8")
          for marker in ("billing_refresh","refreshResellerSession","reseller_refresh_token","AniResellerNative"):
              if marker not in login and marker not in dashboard:
                  raise SystemExit("Reseller secure local API marker missing: " + marker)
          for page in (login,dashboard):
              if "createClient(" in page or "sb.schema('api')" in page or "DB2_ROUTE_URL" in page:
                  raise SystemExit("Supabase or DB1/DB2 route logic remains in Reseller app")
          if "localStorage.setItem(RESELLER_LOGIN_STORE_KEY,String(username||''))" not in login:
              raise SystemExit("Username-only remember login storage missing")
          if "saveResellerLogin(username,d.refresh_token)" not in login:
              raise SystemExit("Refresh token is not the remembered login credential")
          if "127.0.0.1:8788" not in login or "127.0.0.1:8787" in login:
              raise SystemExit("Reseller default is not the isolated Redmi staging API on port 8788")
          if "p_password:password" not in login:
              raise SystemExit("Password is not submitted to local login API")
          java = next(root.rglob("MainActivity.java")).read_text(encoding="utf-8")
          if "getSecureValue(String name)" not in java or "setSecureValue(String name, String value)" not in java:
              raise SystemExit("Android Keystore bridge missing")
          if 'android:networkSecurityConfig="@xml/network_security_config"' not in m:
              raise SystemExit("Localhost network security config missing")
          for name, page in (("index.html",login),("admin-control.html",dashboard)):
              scripts = re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>',page,re.I|re.S)
              if len(scripts)!=1: raise SystemExit("Expected one inline script in "+name)
              out=Path("/tmp/"+name.replace(".html","-db-android.js"))
              out.write_text(scripts[0],encoding="utf-8")
              check=subprocess.run(["node","--check",str(out)],capture_output=True,text=True)
              if check.returncode: raise SystemExit(check.stderr)
          print("PASS: Reseller uses local API, rotating refresh token in Android Keystore, no Supabase route, side-by-side package.")
          PY

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Verify APK identity and prepare output
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::No debug APK was produced"; exit 1; }
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          test -n "$AAPT" || { echo "::error::aapt not found"; exit 1; }
          mkdir -p output
          "$AAPT" dump badging "$APK" > output/apk-badging.txt
          cat output/apk-badging.txt | head -8
          grep -q "package: name='com.anigames.reseller.dbandroid' versionCode='136' versionName='1.0.6'" output/apk-badging.txt || { echo "::error::Built package/version is not the final reseller patch"; exit 1; }
          cp "$APK" output/Ani-Games-Reseller-DB-Android-v1.0.6-debug.apk
