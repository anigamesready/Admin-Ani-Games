name: Build AniGames Admin V12.1.4 Password Reset APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/v12-admin-apk
    paths:
      - 'AniGames-Admin-V12.1.4-ANDROID-PASSWORD-RESET-PATCH-v3.zip'
      - '.github/workflows/build-admin-password-reset.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android source bundle
        shell: bash
        run: |
          set -euo pipefail
          ZIP='AniGames-Admin-V12.1.4-ANDROID-PASSWORD-RESET-PATCH-v3.zip'
          test -f "$ZIP" || { echo "ERROR: source ZIP not found: $ZIP"; exit 1; }
          mkdir -p source-bundle
          unzip -q "$ZIP" -d source-bundle
          GRADLE_FILE="$(find source-bundle -type f -path '*/android/app/build.gradle' -print -quit)"
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: android/app/build.gradle not found in ZIP"
            find source-bundle -maxdepth 5 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$(dirname "$GRADLE_FILE")")"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected Android project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniGames-Admin-V12.1.4-PASSWORD-RESET-DEBUG-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
