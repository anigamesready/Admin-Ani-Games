name: Build AniGames Admin V12.1.28 APK

on:
  push:
    branches:
      - main
      - master
      - build/v12-admin-apk
      - feature/admin-pc-shutdown-timer-v12.1.28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build AniGames Admin V12.1.28 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android source bundle
        run: |
          set -euo pipefail
          test -f "AniGames-Admin-V12.1.4-ANDROID-PASSWORD-RESET-PATCH-v3.zip"
          mkdir -p source-bundle
          unzip -q "AniGames-Admin-V12.1.4-ANDROID-PASSWORD-RESET-PATCH-v3.zip" -d source-bundle
          PROJECT_DIR="$(find source-bundle -type f -path '*/android/app/build.gradle' -print -quit | sed 's#/android/app/build.gradle##')"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android app/build.gradle not found in ZIP contents"
            find source-bundle -maxdepth 4 -type f | head -100
            exit 1
          fi
          test -f "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR/android" >> "$GITHUB_ENV"
          echo "ADMIN_PROJECT_ROOT=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected Android project: $PROJECT_DIR/android"

      - name: Apply Admin patch chain and shutdown timer
        shell: bash
        run: |
          set -euo pipefail
          cd "$ADMIN_PROJECT_ROOT"
          for script in \
            patch_admin_pc_recovery.py \
            patch_admin_android_notifications.py \
            patch_admin_dual_db_preflight.py \
            patch_admin_rental_identity_rpc.py \
            patch_admin_notification_reliability.py \
            patch_admin_shutdown_timer.py; do
            echo "Applying $script"
            python "$GITHUB_WORKSPACE/scripts/$script"
          done
          python - <<'PY'
          from pathlib import Path
          html = Path("android/app/src/main/assets/web/admin.html").read_text(encoding="utf-8")
          for token in ("function schedulePcShutdown()", "function cancelPcShutdown()", 'id="shutdownTargetDevice"', "PRATINJAU SAJA"):
              if token not in html:
                  raise SystemExit("Shutdown timer regression token missing: " + token)
          PY
          
      - name: Set up Node.js for WebView script validation
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Admin WebView JavaScript
        shell: bash
        run: |
          set -euo pipefail
          cd "$ADMIN_PROJECT_ROOT"
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("android/app/src/main/assets/web/admin.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b(?![^>]*\bsrc\s*=)[^>]*>(.*?)</script\s*>', html, flags=re.IGNORECASE | re.DOTALL)
          scripts = [part for part in scripts if part.strip()]
          if not scripts:
              raise SystemExit("No inline Admin script found.")
          Path("admin-webview-check.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check admin-webview-check.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p "$ANDROID_PROJECT_DIR" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniGames-Admin-Android-v12.1.28-debug-apk
          path: source-bundle/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
