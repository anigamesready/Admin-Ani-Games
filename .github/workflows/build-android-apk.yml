name: Build AniGames Admin V12.1.25 Final Login Route Fix APK

on:
  push:
    branches:
      - main
      - master
      - build/v12-admin-apk
      - feature/admin-v12-dual-db-routing
      - feature/admin-v12.1.17-core-db-switch
      - feature/admin-v12.1.18-core-db-switch-usable-sync
      - feature/admin-v12.1.19-global-route-continuity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build AniGames Admin V12.1.25 Final Login Route Fix Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android source bundle
        run: |
          set -euo pipefail
          test -f "AniGames-Admin-V12.1.4-ANDROID-PASSWORD-RESET-PATCH-v3.zip"
          mkdir -p source-bundle
          unzip -q "AniGames-Admin-V12.1.4-ANDROID-PASSWORD-RESET-PATCH-v3.zip" -d source-bundle
          PROJECT_DIR="$(find source-bundle -type f -path '*/android/app/build.gradle' -print -quit | sed 's#/android/app/build.gradle##')"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android app/build.gradle not found in ZIP contents"
            find source-bundle -maxdepth 4 -type f | head -100
            exit 1
          fi
          test -f "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          echo "ADMIN_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR/android" >> "$GITHUB_ENV"
          echo "Detected Admin project: $PROJECT_DIR"

      - name: Apply Admin V12.1.14 dual-DB patches
        shell: bash
        run: |
          set -euo pipefail
          patches=(
            "scripts/patch_admin_pc_recovery.py"
            "scripts/patch_admin_android_notifications.py"
            "scripts/patch_admin_dual_db_preflight.py"
            "scripts/patch_admin_rental_identity_rpc.py"
            "scripts/patch_admin_notification_reliability.py"
            "scripts/patch_admin_dual_db_routing.py"
            "scripts/patch_admin_db_sync_global_switch.py"
            "scripts/patch_admin_final_readiness.py"
            "scripts/patch_admin_copy_redirect.py"
            "scripts/patch_admin_report_exports.py"
            "scripts/patch_admin_v12_1_17_core_db.py"
            "scripts/patch_admin_gateway_readiness.py"
            "scripts/patch_admin_cutover_without_sync.py"
            "scripts/patch_admin_v12_1_22_full_sync.py"
            "scripts/patch_admin_v12_1_23_final_package.py"
            "scripts/patch_admin_v12_1_24_owner_proof.py"
          )
          for patch in "${patches[@]}"; do
            cp "$GITHUB_WORKSPACE/$patch" "$ADMIN_PROJECT_DIR/$(basename "$patch")"
          done
          cd "$ADMIN_PROJECT_DIR"
          python3 patch_admin_pc_recovery.py
          python3 patch_admin_android_notifications.py
          python3 patch_admin_dual_db_preflight.py
          python3 patch_admin_rental_identity_rpc.py
          python3 patch_admin_notification_reliability.py
          python3 patch_admin_dual_db_routing.py
          python3 patch_admin_db_sync_global_switch.py
          python3 patch_admin_final_readiness.py
          python3 patch_admin_copy_redirect.py
          python3 patch_admin_report_exports.py
          test "$(grep -c 'automatic failover is disabled' android/app/src/main/assets/web/admin.html)" -ge 1
          test "$(grep -c 'ROUTE_FINAL_CONFIRMATION_FAILED' android/app/src/main/assets/web/admin.html)" -ge 1
          grep -q "versionCode 44" android/app/build.gradle
          grep -q "versionName '12.1.16'" android/app/build.gradle
          grep -q "function exportExcelFallbackXLSX" android/app/src/main/assets/web/admin.html
          grep -q "async function ensureJsPDF" android/app/src/main/assets/web/admin.html
          grep -q "function blynkUserError" android/app/src/main/assets/web/admin.html
          grep -q "DB_SYNC_REQUIRED: parity data/auth belum cocok" android/app/src/main/assets/web/admin.html
          grep -q "var charts=window.charts" android/app/src/main/assets/web/admin.html
          grep -q "async function saveReportFileDownload" android/app/src/main/assets/web/admin.html
          grep -q "saveReportFile(String filename, String mimeType, String base64Payload)" android/app/src/main/java/com/anigames/billingadmin/MainActivity.java
          grep -q "Downloads/Ani Games Reports" android/app/src/main/java/com/anigames/billingadmin/MainActivity.java
          python3 - <<'PY'
          import re
          from pathlib import Path
          page = Path("android/app/src/main/assets/web/admin.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>', page, re.I | re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline admin app script, found {len(scripts)}")
          Path("/tmp/admin-inline-check.js").write_text(scripts[0], encoding="utf-8")
          PY
          python3 patch_admin_v12_1_17_core_db.py
          python3 patch_admin_gateway_readiness.py
          python3 patch_admin_cutover_without_sync.py
          python3 patch_admin_v12_1_22_full_sync.py
          python3 patch_admin_v12_1_23_final_package.py
          python3 patch_admin_v12_1_24_owner_proof.py
          python3 patch_admin_v12_1_25_login_route_boot_fix.py
          python3 -m py_compile patch_admin_cutover_without_sync.py patch_admin_v12_1_22_full_sync.py patch_admin_v12_1_23_final_package.py patch_admin_v12_1_24_owner_proof.py
          grep -q "versionCode 53" android/app/build.gradle
          grep -q "versionName '12.1.25'" android/app/build.gradle
          grep -q "V12.1.25-ROUTE-BOOT-SEPARATION" android/app/src/main/assets/web/admin.html
          grep -q "applicationId 'com.anigames.billingadmin'" android/app/build.gradle
          ! grep -q "com.anigames.billingadmin.v12test" android/app/build.gradle
          grep -q 'android:label="AniGames Admin"' android/app/src/main/AndroidManifest.xml
          ! grep -q "AniGames Admin V12 Test" android/app/src/main/AndroidManifest.xml
          ! grep -q "coreDbCall('sync-core')" android/app/src/main/assets/web/admin.html
          grep -q "dbSyncCall('start')" android/app/src/main/assets/web/admin.html
          grep -q "dbSyncCall('apply-page'" android/app/src/main/assets/web/admin.html
          grep -q "dbSyncCall('verify-table'" android/app/src/main/assets/web/admin.html
          grep -q "dbSyncCall('mark-ready'" android/app/src/main/assets/web/admin.html
          grep -q "requestSharedDbRouteSwitch" android/app/src/main/assets/web/admin.html
          grep -q "refreshGatewayReadiness" android/app/src/main/assets/web/admin.html
          grep -q "db-route-readiness" android/app/src/main/assets/web/admin.html
          grep -q "Verifikasi login" android/app/src/main/assets/web/admin.html
          grep -q "V12.1.21-ROUTE-CUTOVER-WITHOUT-FORCED-SYNC" android/app/src/main/assets/web/admin.html
          grep -q "V12.1.22-FULL-12-TABLE-INCREMENTAL-SYNC" android/app/src/main/assets/web/admin.html
          grep -q "V12.1.23-FINAL-ADMIN-PACKAGE" android/app/src/main/assets/web/admin.html
          grep -q "V12.1.24-CROSS-PROJECT-OWNER-PROOF" android/app/src/main/assets/web/admin.html
          grep -q "ownerProof=state.proof" android/app/src/main/assets/web/admin.html
          grep -q "reconcile-active-sessions" android/app/src/main/assets/web/admin.html
          grep -q "TARGET_OWNER_LOGIN_TEST_REQUIRED" android/app/src/main/assets/web/admin.html
          grep -q "Perpindahan ini TIDAK menjalankan Sync" android/app/src/main/assets/web/admin.html
          grep -q "rental_sessions" android/app/src/main/assets/web/admin.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          page = Path("android/app/src/main/assets/web/admin.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>', page, re.I | re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline admin app script after V12.1.17 core patch, found {len(scripts)}")
          Path("/tmp/admin-inline-check-v12-1-17.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/admin-inline-check-v12-1-17.js
          echo "PASS: Admin V12.1.22 full 12-table incremental Sync + row/hash proofs + target Owner login + Gateway and coordinated route guards + browser JS syntax."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and verify final APK package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$ANDROID_PROJECT_DIR" assembleDebug
          APK="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -n "$AAPT" && test -n "$APKSIGNER"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/AniGames-Admin-V12.1.25-debug.apk"
          "$AAPT" dump badging "$GITHUB_WORKSPACE/output/AniGames-Admin-V12.1.25-debug.apk" | tee "$GITHUB_WORKSPACE/output/apk-badging.txt"
          grep -q "package: name='com.anigames.billingadmin' versionCode='53' versionName='12.1.25'" "$GITHUB_WORKSPACE/output/apk-badging.txt"
          grep -q "application-label:'AniGames Admin'" "$GITHUB_WORKSPACE/output/apk-badging.txt"
          "$APKSIGNER" verify --verbose "$GITHUB_WORKSPACE/output/AniGames-Admin-V12.1.25-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/output/AniGames-Admin-V12.1.25-debug.apk" | tee "$GITHUB_WORKSPACE/output/SHA256SUMS.txt"
          unzip -t "$GITHUB_WORKSPACE/output/AniGames-Admin-V12.1.25-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/output/AniGames-Admin-V12.1.25-debug.apk"

      - name: Upload final Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: AniGames-Admin-Android-v12.1.25-final-debug-apk
          path: output/*
          if-no-files-found: error
          retention-days: 30
