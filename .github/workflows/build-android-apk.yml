name: Build AniGames Admin V12.1.0 APK

on:
  push:
    branches:
      - main
      - master
      - build/v12-admin-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build AniGames Admin V12.1.0 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source project
        run: test -f Ani-Games-Billing-Android-V12.1.0/android/app/build.gradle && test -f Ani-Games-Billing-Android-V12.1.0/android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p Ani-Games-Billing-Android-V12.1.0/android assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ani-Games-Admin-Android-v12.1.0-debug-apk
          path: Ani-Games-Billing-Android-V12.1.0/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
