name: Build AniGames Admin V12.1.16 Dual DB Final APK

on:
  push:
    branches:
      - main
      - master
      - build/v12-admin-apk
      - feature/admin-v12-dual-db-routing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build AniGames Admin V12.1.16 Dual DB Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android source bundle
        run: |
          set -euo pipefail
          test -f "AniGames-Admin-V12.1.4-ANDROID-PASSWORD-RESET-PATCH-v3.zip"
          mkdir -p source-bundle
          unzip -q "AniGames-Admin-V12.1.4-ANDROID-PASSWORD-RESET-PATCH-v3.zip" -d source-bundle
          PROJECT_DIR="$(find source-bundle -type f -path '*/android/app/build.gradle' -print -quit | sed 's#/android/app/build.gradle##')"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android app/build.gradle not found in ZIP contents"
            find source-bundle -maxdepth 4 -type f | head -100
            exit 1
          fi
          test -f "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          echo "ADMIN_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR/android" >> "$GITHUB_ENV"
          echo "Detected Admin project: $PROJECT_DIR"

      - name: Apply Admin V12.1.14 dual-DB patches
        shell: bash
        run: |
          set -euo pipefail
          patches=(
            "scripts/patch_admin_pc_recovery.py"
            "scripts/patch_admin_android_notifications.py"
            "scripts/patch_admin_dual_db_preflight.py"
            "scripts/patch_admin_rental_identity_rpc.py"
            "scripts/patch_admin_notification_reliability.py"
            "scripts/patch_admin_dual_db_routing.py"
            "scripts/patch_admin_db_sync_global_switch.py"
            "scripts/patch_admin_final_readiness.py"
            "scripts/patch_admin_copy_redirect.py"
          )
          for patch in "${patches[@]}"; do
            cp "$GITHUB_WORKSPACE/$patch" "$ADMIN_PROJECT_DIR/$(basename "$patch")"
          done
          cd "$ADMIN_PROJECT_DIR"
          python3 patch_admin_pc_recovery.py
          python3 patch_admin_android_notifications.py
          python3 patch_admin_dual_db_preflight.py
          python3 patch_admin_rental_identity_rpc.py
          python3 patch_admin_notification_reliability.py
          python3 patch_admin_dual_db_routing.py
          python3 patch_admin_db_sync_global_switch.py
          python3 patch_admin_final_readiness.py
          python3 patch_admin_copy_redirect.py
          test "$(grep -c 'automatic failover is disabled' android/app/src/main/assets/web/admin.html)" -ge 1
          test "$(grep -c 'ROUTE_FINAL_CONFIRMATION_FAILED' android/app/src/main/assets/web/admin.html)" -ge 1
          grep -q "versionCode 44" android/app/build.gradle
          grep -q "versionName '12.1.16'" android/app/build.gradle
          grep -q "function exportExcelFallbackXLSX" android/app/src/main/assets/web/admin.html
          grep -q "async function ensureJsPDF" android/app/src/main/assets/web/admin.html
          grep -q "function blynkUserError" android/app/src/main/assets/web/admin.html
          grep -q "DB_SYNC_REQUIRED: parity data/auth belum cocok" android/app/src/main/assets/web/admin.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          page = Path("android/app/src/main/assets/web/admin.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>', page, re.I | re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline admin app script, found {len(scripts)}")
          Path("/tmp/admin-inline-check.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/admin-inline-check.js
          echo "Dual-DB route guards and global-switch final confirmation verified in Admin HTML."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p "$ANDROID_PROJECT_DIR" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniGames-Admin-Android-v12.1.16-dual-db-final-debug-apk
          path: source-bundle/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
